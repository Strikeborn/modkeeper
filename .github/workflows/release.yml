name: Release

# Push a tag like v0.2.0 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # softprops/action-gh-release below attaches the files; electron-builder must not try to publish on its own
      # (on a tag in CI it does by default, and fails without a token)
      - run: npm run dist -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ModKeeper-Setup-*.exe
            release/ModKeeper-Setup-*.exe.blockmap
          generate_release_notes: true
